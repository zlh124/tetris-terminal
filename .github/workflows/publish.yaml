name: Publish to PyPI

# 触发时机：master 上 pyproject.toml 有改动，且其中的版本号尚未发布到 PyPI。
# 判定依据是 PyPI 上该版本是否存在，而不是和上一个 commit 比版本号 ——
# 这样一次 push 里包含多个 commit 也不会漏发。
on:
  push:
    branches: [master]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/publish.yaml'
  # 手动兜底：发布失败后可重跑
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # 只允许 master，避免从其他分支手动触发时把未发布的版本发出去
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tetris-terminal/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install uv twine tomli

      - name: Read version from pyproject.toml
        id: version
        run: |
          NAME=$(python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['name'])")
          VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml: $NAME $VERSION"

      - name: Check if this version was published already
        id: check
        run: |
          NAME="${{ steps.version.outputs.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://pypi.org/pypi/$NAME/$VERSION/json"
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "$URL") || HTTP="000"
          case "$HTTP" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$NAME $VERSION is already on PyPI -> version unchanged, skipping publish."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "$NAME $VERSION not found on PyPI -> proceeding with build and publish."
              ;;
            *)
              # 网络/接口异常时宁可失败，也不要重复上传造成 "File already exists"
              echo "Unexpected HTTP '$HTTP' from $URL" >&2
              exit 1
              ;;
          esac

      - name: Clean history version
        if: steps.check.outputs.published == 'false'
        run: rm -rf dist

      - name: Build package
        if: steps.check.outputs.published == 'false'
        run: python -m uv build

      - name: Publish to PyPI
        if: steps.check.outputs.published == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/* --verbose
