name: Publish to PyPI

on:
  push:
    branches: [master]
    # 仅当 pyproject.toml 被修改时触发（避免无关提交触发）
    paths:
      - 'pyproject.toml'
      - '.github/workflows/publish.yml'
      - 'src/**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://github.com/zlh124/tetris-terminal.git

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: |
          python -m pip install tomli
          python -m pip install twine

      - name: Extract current version
        id: get-version
        run: |
          VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION="${{ steps.get-version.outputs.version }}"
          PREV_VERSION=$(git show HEAD~1:pyproject.toml 2>/dev/null | python -c "import sys,tomli; print(tomli.load(sys.stdin.buffer)['project']['version'])" 2>/dev/null || echo "none")
          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREV_VERSION"
          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed — proceeding with publish."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged — skipping publish."
          fi

      - name: Clean history version
        if: steps.version-check.outputs.changed == 'true'
        run: rm -rf dist

      - name: Build package
        if: steps.version-check.outputs.changed == 'true'
        run: python -m uv build

      - name: Publish to PyPI
        if: steps.version-check.outputs.changed == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/* --verbose
